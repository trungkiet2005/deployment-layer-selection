[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dls-egt"
version = "1.2.0"
description = "Deployment-layer selection in evolutionary AI-race dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "evolutionary game theory",
    "replicator dynamics",
    "AI safety",
    "technological race",
    "liability",
    "hysteresis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "egttools>=0.1.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
